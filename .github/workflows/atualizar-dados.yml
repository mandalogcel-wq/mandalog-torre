name: Atualizar dados da operação

# Puxa a aba da planilha, regera data/operacao.json e comita se algo mudou.
#
# Pré-requisitos (Settings > Secrets and variables > Actions):
#   SHEET_ID            id da planilha ROTEIRIZAÇÃO 2026
#   GOOGLE_SA_JSON      JSON da conta de serviço com acesso de leitura à planilha
#   PAINEL_SENHA        senha de acesso ao painel, usada para cifrar os dados
#   N8N_WEBHOOK_URL     URL de produção do workflow "Torre 3C · API GreenMile"
#   N8N_WEBHOOK_TOKEN   valor do header X-Torre-Token dessa credencial
#   N8N_ALERTA_URL      URL de produção do workflow "Torre · Alerta de Falha"
#                       (mesmo header X-Torre-Token acima — credencial reaproveitada)
#
# Compartilhe a planilha com o e-mail da conta de serviço como Leitor.
# Assim a planilha permanece privada — não é preciso publicá-la na web.
#
# Só data/operacao.enc é comitado. O CSV e o JSON em texto claro ficam no
# .gitignore, porque o GitHub Pages publica todo o conteúdo do repositório.

on:
  # Quem agenda é o Apps Script, na planilha ROTEIRIZAÇÃO 2026, função
  # torreDispararRobo, a cada 15 min entre 5h e 21h de Brasília.
  #
  # O `schedule` nativo foi removido de propósito: em repositório público é
  # melhor esforço declarado e o GitHub descarta execuções sem aviso. Medido em
  # 05 e 06/08, pedindo de 20 em 20 minutos, o intervalo real ficou entre 1h15 e
  # 3h30. Mantê-lo junto do Apps Script só multiplicava disparos concorrentes.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  # NUNCA cancelar a execução em andamento. Ela pode estar no passo de commit,
  # e matá-la significa perder a atualização do painel. Com disparos a cada
  # 15 min e execução de ~30s, a fila praticamente nunca é usada; quando for,
  # o disparo novo espera em vez de destruir o anterior.
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install --quiet gspread google-auth cryptography

      - name: Baixar abas da planilha
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: python3 scripts/baixar_planilha.py

      - name: Gerar JSON do painel
        run: python3 scripts/build_data.py

      # Entre o build e a cifragem, de propósito: o desfecho do GreenMile entra
      # no mesmo payload que o painel já consome, sem endpoint novo e sem dado
      # em texto claro fora do .enc. Se o n8n estiver fora do ar, o script avisa
      # e segue — o painel publica só com o dado da planilha, como sempre foi.
      - name: Mesclar desfecho do GreenMile
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          N8N_WEBHOOK_TOKEN: ${{ secrets.N8N_WEBHOOK_TOKEN }}
        run: python3 scripts/mesclar_greenmile.py

      # Posição do rastreador nas viagens de Arcor e Supley. Chama a Krona
      # direto, sem n8n no meio: é uma chamada SOAP só, e um workflow
      # intermediário seria mais uma peça para quebrar. Se a Krona cair, o
      # script avisa e segue — o painel publica sem posição, como antes.
      #
      # Depois do build_data.py, que é quem cria o viagens.json, e antes do
      # fatiar.py, que recorta a posição por cliente.
      - name: Mesclar posição do rastreador (Krona)
        env:
          KRONA_EMPRESA: ${{ secrets.KRONA_EMPRESA }}
          KRONA_USUARIO: ${{ secrets.KRONA_USUARIO }}
          KRONA_SENHA:   ${{ secrets.KRONA_SENHA }}
        run: python3 scripts/mesclar_krona.py

      # Um payload por cliente, e a prova de que não vazou nada entre eles.
      # O script confere o arquivo pronto e derruba esta execução se encontrar
      # dado de um cliente no payload de outro — antes de cifrar e publicar.
      # Desde 31/08/2026 confere também a posição do rastreador: placa que não
      # está na frota nem nas viagens do cliente não pode ter ponto no mapa dele.
      - name: Fatiar por cliente
        run: python3 scripts/fatiar.py

      - name: Cifrar os dados com a senha de acesso
        env:
          # A senha da 3 Corações mantém o nome antigo e o arquivo antigo
          # (operacao.enc): é o painel que já está no ar, com o cliente usando.
          PAINEL_SENHA:   ${{ secrets.PAINEL_SENHA }}
          SENHA_ARCOR:    ${{ secrets.SENHA_ARCOR }}
          SENHA_SUPLEY:   ${{ secrets.SENHA_SUPLEY }}
          SENHA_MANDALOG: ${{ secrets.SENHA_MANDALOG }}
        run: python3 scripts/cifrar.py

      - name: Comitar se houver mudança
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A pasta inteira, e não arquivo por arquivo: `git add` falha por
          # completo se um dos caminhos não existir, e enquanto uma senha de
          # cliente não estiver configurada o .enc dele não existe — isso
          # derrubaria a publicação de todos os outros. Listar um a um também
          # significa lembrar de editar aqui a cada cliente novo.
          #
          # É seguro porque o .gitignore bloqueia data/*.json e data/raw/:
          # em data/ só sobra o que é cifrado.
          git add -A data/
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "dados: atualização automática $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')"
            git push
          fi

      # Depois do commit, de propósito: uma indisponibilidade da Z-API não pode
      # impedir a atualização do painel, que é o que importa. O script decide
      # sozinho se está na janela de envio (Brasília) e se há operação no dia.
      - name: Avisar o grupo do Vale no WhatsApp
        env:
          ZAPI_INSTANCE:     ${{ secrets.ZAPI_INSTANCE }}
          ZAPI_TOKEN:        ${{ secrets.ZAPI_TOKEN }}
          ZAPI_CLIENT_TOKEN: ${{ secrets.ZAPI_CLIENT_TOKEN }}
          ZAPI_GRUPO:        ${{ secrets.ZAPI_GRUPO }}
          JANELA: "6-20"
        run: python3 scripts/avisar_whatsapp.py

      # Só roda se algum passo acima falhou. É o outro lado da falha silenciosa
      # de Guarulhos em 21/08: aba não encontrada, credencial vencida ou
      # cifragem quebrada agora chegam por e-mail em vez de só aparecerem no
      # selo de frescor da tela, dias depois. curl -sf: se o próprio alerta
      # falhar, não trava o job — ele já falhou, não há mais o que proteger.
      - name: Avisar falha da automação por e-mail
        if: failure()
        env:
          N8N_ALERTA_URL:   ${{ secrets.N8N_ALERTA_URL }}
          N8N_WEBHOOK_TOKEN: ${{ secrets.N8N_WEBHOOK_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sf -X POST "$N8N_ALERTA_URL" \
            -H "X-Torre-Token: $N8N_WEBHOOK_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c 'import json, os; print(json.dumps({
              "job": "Atualizar dados da operação",
              "mensagem": "Um passo do robo falhou. Veja o log da execucao para o detalhe.",
              "run_url": os.environ["RUN_URL"],
            }))')" \
          || echo "aviso: não consegui notificar o n8n (a falha original segue valendo)"
